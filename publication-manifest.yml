version: 1
status: approved-for-bilingual-github-pages-release
public_site:
  role: curated-public-learning-resource
  output_directory: docs
  primary_publishing_target: github-pages
  github_repository: Shihao-Yang/isye4031-public-course
  institutional_discovery_target: https://sites.gatech.edu/shihao-yang/
  source_of_truth: local-markdown-and-git
  languages:
    - code: en
      path: /
    - code: zh-Hans
      path: /zh/

allowlist:
  pages:
    - index
    - teaching-model
    - learning-path
    - sample-lesson
    - materials
    - lectures
  lecture_replays:
    - key: lecture13-regression-pitfalls-v3
      public_output: docs/replay/
      transcript: docs/replay/examples/lecture13-v3-replay.md
      source: ../../llm-chat-replay/public/examples/lecture13-v3-replay.md
      data_provenance: same-owner-approved-course-file-5-1.txt-plus-explicitly-constructed-teaching-experiments
      release_status: owner-requested-setup-visuals-and-coverage-extension-previous-versions-retained
      player_license: MIT
      assets: linked-classroom-results-code-plots-input-csv-and-requirements-only
    - key: lecture13-regression-pitfalls-v2
      public_output: docs/replay/
      transcript: docs/replay/examples/lecture13-v2-replay.md
      source: ../../llm-chat-replay/public/examples/lecture13-v2-replay.md
      data_provenance: same-owner-approved-course-file-5-1.txt-as-lecture12
      release_status: owner-requested-conversational-revision-of-approved-lecture13-original-retained
      player_license: MIT
      assets: linked-classroom-results-code-plots-input-csv-and-requirements-only
    - key: lecture13-regression-pitfalls
      public_output: docs/replay/
      transcript: docs/replay/examples/lecture13-replay.md
      source: ../../llm-chat-replay/public/examples/lecture13-replay.md
      data_provenance: same-owner-approved-course-file-5-1.txt-as-lecture12
      release_status: owner-approved-2026-10-13-after-local-replay-review
      player_license: MIT
      assets: linked-classroom-results-code-plots-input-csv-and-requirements-only
    - key: lecture12-model-selection
      public_output: docs/replay/
      transcript: docs/replay/examples/lecture12-replay.md
      source: ../../llm-chat-replay/public/examples/lecture12-replay.md
      data_provenance: course-file-5-1.txt
      release_status: owner-approved-2026-10-13-after-preview-and-redistribution-question
      player_license: MIT
      assets: linked-classroom-results-code-plots-and-input-csv-only
  review_materials:
    - key: statistical-review-slides
      source_display_name: ISYE4031_Week01_Class02.pdf
      local_source: ../course-design/slides/week01_class02/ISYE4031_Week01_Class02.pdf
      public_output: docs/materials/ISYE4031_Week01_Class02.pdf
      release_status: owner-approved-and-content-reviewed-pdf-untagged
    - key: simple-linear-regression-slides
      source_display_name: null
      local_source: ../course-design/slides/week02_class03/ISYE4031_Week02_Class03.pdf
      public_output: docs/materials/ISYE4031_Week02_Class03.pdf
      release_status: owner-approved-and-content-reviewed-pdf-untagged
  automated_review_materials:
    source: instructor-controlled Canvas course files
    public_output_rule: retain the sanitized instructor filename; append a content hash only on collision
    allowed_formats:
      - pdf
      - pptx
    inclusion_rule: English lecture slides matching the local title allowlist
    exclusions:
      - assignments, homework, exams, quizzes, answers, solutions, and grading material
      - locked or hidden files
      - files containing contact information, credentials, private links, or roster denylist terms
      - files that fail text, metadata, or OCR inspection
    release_status: owner-authorized-for-automated-publication-after-all-privacy-gates

denylist:
  - student records and contact information
  - submissions, grades, attendance, and recordings
  - announcements and accommodations
  - exams, solutions, question banks, and instructor-only assessments
  - learning-management-system exports and API responses
  - credentials, verifier URLs, and private repository links
  - locally stored textbook
  - material without confirmed redistribution permission

release_gates:
  - owner publication authorization
  - mathematical review
  - deterministic privacy and assessment-security scan using the in-memory roster denylist
  - independent read-only Codex publication-safety audit
  - contributor provenance and redistribution review
  - PDF and Office metadata, extracted-text, and OCR review
  - link and responsive-layout review
